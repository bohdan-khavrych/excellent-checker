name: House Checker

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: house-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run checker
        run: node index.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_ID_FILTER: ${{ secrets.TG_CHAT_ID_FILTER }}

      - name: Save db.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json
          if ! git diff --cached --quiet; then
            git commit -m "update db"
            git pull --rebase
            git push
          fi

      - name: Cleanup old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $((GITHUB_RUN_NUMBER % 50)) -ne 0 ]; then exit 0; fi
          CUTOFF=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/checker.yml/runs" \
            -f per_page=100 -f created="<$CUTOFF" --jq '.workflow_runs[].id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}"
